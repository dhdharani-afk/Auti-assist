databases:
  - name: autiassist-postgres
    databaseName: autiassist
    user: autiassist
    plan: basic-256mb

services:
  - type: web
    name: autiassist-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: AUTIASSIST_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: autiassist-postgres
          property: connectionString
      - key: FRONTEND_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: openai_compatible
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        sync: false
      - key: WEB_CONCURRENCY
        value: 1
